<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">CompanyName</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="profile.html">Our Profile</a></li>
        </ul>
    </nav>

    <header>
        <h1>Hi <span id="username">Guest</span>!</h1>
        <p>Welcome to our company website</p>
    </header>

    <section class="message-form">
        <h2>Message Us</h2>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone">
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </section>

    <section id="formResult" class="hidden">
        <h3>Submitted Data</h3>
        <p>Name: <span id="resultName"></span></p>
        <p>Email: <span id="resultEmail"></span></p>
        <p>Phone: <span id="resultPhone"></span></p>
        <p>Message: <span id="resultMessage"></span></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
